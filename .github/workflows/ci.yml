name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '17'
          - os: windows-latest
            java: '17'
          - os: ubuntu-latest
            java: '21'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test and check formatting (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Build, test and check formatting (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify
      - name: Smoke test executable JAR
        shell: bash
        run: |
          printf 'help\nexit\n' | java -Djava.awt.headless=true -jar target/url-shortener.jar > target/smoke.log
          cat target/smoke.log
          grep -q 'create' target/smoke.log
      - name: Upload application and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: url-shortener-${{ matrix.os }}-java-${{ matrix.java }}
          path: |
            target/url-shortener.jar
            config/application.properties
            README.md
            target/surefire-reports/
            target/smoke.log
          if-no-files-found: warn
          retention-days: 7
