name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '17'
          - os: windows-latest
            java: '17'
          - os: ubuntu-latest
            java: '21'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test and check formatting (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Build, test and check formatting (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify
      - name: Smoke test executable JAR
        shell: bash
        run: |
          printf 'help\nexit\n' | java -Djava.awt.headless=true -jar target/url-shortener.jar > target/smoke.log
          cat target/smoke.log
          grep -q 'create' target/smoke.log
      - name: Upload application and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: url-shortener-${{ matrix.os }}-java-${{ matrix.java }}
          path: |
            target/url-shortener.jar
            config/application.properties
            README.md
            target/surefire-reports/
            target/smoke.log
          if-no-files-found: warn
          retention-days: 7
